name: Test & build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases for version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Read app version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from simconfigmanager.core import APP_VERSION; print(APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0


      - name: Build SimConfigManager.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name SimConfigManager SimConfigManager.pyw

      # Claude connector: console program (stdin/stdout), no admin rights, no Qt
      - name: Build SimConfigManager-MCP.exe
        run: python -m PyInstaller --noconfirm --onefile --console --exclude-module PySide6 --name SimConfigManager-MCP SimConfigManager-MCP.py

      - name: Smoke-test the connector exe
        shell: pwsh
        run: |
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          $out = "$init`n$list`n" | dist\SimConfigManager-MCP.exe --data "$env:RUNNER_TEMP\nodata"
          $out
          if (-not ($out -match '"read_file"')) { throw "connector did not answer tools/list" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\SimConfigManager.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-ChildItem dist

      - name: Checksum
        shell: pwsh
        run: |
          $setup = "SimConfigManager-Setup-${{ steps.ver.outputs.version }}.exe"
          $lines = foreach ($n in $setup, "SimConfigManager.exe", "SimConfigManager-MCP.exe") {
            "$((Get-FileHash "dist\$n" -Algorithm SHA256).Hash.ToLower()) *$n"
          }
          $lines | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SimConfigManager-windows
          path: |
            dist/SimConfigManager-Setup-*.exe
            dist/SimConfigManager.exe
            dist/SimConfigManager-MCP.exe
            dist/SHA256SUMS.txt

      # A release is published automatically the first time a new APP_VERSION (simconfigmanager/core.py)
      # reaches main, or when a v* tag is pushed. Existing releases are never overwritten.
      - name: Publish release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false')
          || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: SimConfigManager ${{ steps.ver.outputs.version }}
          files: |
            dist/SimConfigManager-Setup-*.exe
            dist/SimConfigManager.exe
            dist/SimConfigManager-MCP.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
