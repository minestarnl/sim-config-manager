name: Test & build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases for version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build SimConfigKeeper.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name SimConfigKeeper SimConfigKeeper.pyw

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\SimConfigKeeper.exe -Algorithm SHA256).Hash.ToLower()
          "$h *SimConfigKeeper.exe" | Out-File -Encoding ascii dist\SimConfigKeeper.exe.sha256
          Get-Content dist\SimConfigKeeper.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SimConfigKeeper-windows
          path: |
            dist/SimConfigKeeper.exe
            dist/SimConfigKeeper.exe.sha256

      - name: Publish release (only for version tags like v1.3.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SimConfigKeeper.exe
            dist/SimConfigKeeper.exe.sha256
          generate_release_notes: true
