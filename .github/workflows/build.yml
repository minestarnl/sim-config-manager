name: Test & build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q -rs tests

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from simconfigmanager.core import APP_VERSION; print(APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      # The app asks for administrator rights itself when it starts as the sim's own app,
      # and doesn't need them in remote mode (--remote), so no requireAdministrator manifest.
      - name: Build SimConfigManager.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name SimConfigManager --add-data "simconfigmanager/assets;simconfigmanager/assets" SimConfigManager.pyw

      # Claude connector: console program (stdin/stdout), no admin rights, no Qt
      - name: Build SimConfigManager-MCP.exe
        run: python -m PyInstaller --noconfirm --onefile --console --exclude-module PySide6 --name SimConfigManager-MCP SimConfigManager-MCP.py

      - name: Smoke-test the connector exe
        shell: pwsh
        run: |
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $list = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          $out = "$init`n$list`n" | dist\SimConfigManager-MCP.exe --data "$env:RUNNER_TEMP\nodata"
          $out
          if (-not ($out -match '"read_file"')) { throw "connector did not answer tools/list" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\SimConfigManager.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/SimConfigManager-Setup-*.exe
            dist/SimConfigManager.exe
            dist/SimConfigManager-MCP.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      # also exercises the Mac relay (bash + curl) and the ChatGPT setup script for real on macOS
      - name: Run tests
        run: python -m pytest -q -rs tests

      - name: Build the Mac app (remote mode)
        run: |
          python -m PyInstaller --noconfirm --windowed --name SimConfigManager \
            --osx-bundle-identifier nl.simconfigmanager.app \
            --add-data "simconfigmanager/assets:simconfigmanager/assets" SimConfigManager.pyw
          ditto -c -k --keepParent dist/SimConfigManager.app dist/SimConfigManager-mac.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/SimConfigManager-mac.zip

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hub tests
        working-directory: hub
        run: npm test
      - name: Package the hub
        run: |
          v=$(grep -oP 'APP_VERSION = "\K[^"]+' simconfigmanager/core/util.py)
          mkdir -p dist && cd hub && zip -r "../dist/SimConfigManager-Hub-$v.zip" package.json config.example.json \
            Dockerfile scm-hub.service src public
      - uses: actions/upload-artifact@v4
        with:
          name: hub
          path: dist/SimConfigManager-Hub-*.zip

  release:
    needs: [windows, mac, hub]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum SimConfigManager-Setup-*.exe SimConfigManager.exe SimConfigManager-MCP.exe SimConfigManager-mac.zip \
            SimConfigManager-Hub-*.zip \
            | sed 's/  / */' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Does this version have a release yet?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ needs.windows.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      # Published the first time a new APP_VERSION (simconfigmanager/core/util.py) reaches main, or for a v* tag.
      # Existing releases are never overwritten.
      - name: Publish release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false')
          || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.windows.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: SimConfigManager ${{ needs.windows.outputs.version }}
          files: |
            dist/SimConfigManager-Setup-*.exe
            dist/SimConfigManager.exe
            dist/SimConfigManager-MCP.exe
            dist/SimConfigManager-mac.zip
            dist/SimConfigManager-Hub-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
